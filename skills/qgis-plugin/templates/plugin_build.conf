# plugin_build.conf - build manifest for build_plugin.sh / build_plugin.py.
#
# Copy this to the ROOT of your plugin repo and edit. The build scripts read it
# and need no per-plugin editing themselves.
#
# Syntax is a restricted subset of bash: NAME="value" and NAME=( item item ).
# Comments and blank lines are ignored. Do not put command substitution or logic
# in here - build_plugin.py parses it directly and will not execute it.

# ---------------------------------------------------------------------------
# PLUGIN - the single top-level folder inside the zip.
#
# MUST equal the plugin package name, i.e. the folder QGIS installs into and the
# name Python imports. If you vendor a third-party package under libs/, PLUGIN
# must NOT match that package's name or it shadows it at import time.
# ---------------------------------------------------------------------------
PLUGIN="MyPlugin"

# ---------------------------------------------------------------------------
# FILES - individual files copied to the zip root.
#
# List EVERY module the plugin imports, plus metadata.txt, the icon, and
# LICENSE. A missing module here is the classic ModuleNotFoundError on install.
# ---------------------------------------------------------------------------
FILES=(
  __init__.py
  myplugin.py
  myplugin_dockwidget.py
  myplugin_dockwidget_base.ui
  metadata.txt
  icon.svg
  LICENSE
  README.md
)

# ---------------------------------------------------------------------------
# DIRS - directories copied recursively.
#
# THIS is what make / pb_tool silently drop. Every imported subpackage and every
# asset dir goes here. Caches and VCS dirs are stripped automatically.
# ---------------------------------------------------------------------------
DIRS=(
  db
  widgets
  icons
  i18n
)

# ---------------------------------------------------------------------------
# VERIFY - entries asserted to be present in the BUILT zip.
#
# This is the self-verify step that catches a silently incomplete package.
# Include one entry per DIR (with a trailing slash), plus LICENSE and
# metadata.txt at minimum.
# ---------------------------------------------------------------------------
VERIFY=(
  db/
  widgets/
  icons/
  LICENSE
  metadata.txt
)

# ---------------------------------------------------------------------------
# Optional knobs
# ---------------------------------------------------------------------------

# Extra regex alternatives rejected from the built zip, appended to the built-in
# forbidden list (binaries, archives, __pycache__, .git, compiled resources.py,
# docs/, and *.sh).
# FORBIDDEN_EXTRA="go-pmtiles|\.dat$"

# Output zip path. Defaults to ./<PLUGIN>.zip next to the manifest.
# OUT="dist/MyPlugin.zip"

# Set to 1 ONLY if you have a reviewed reason to ship a shell script inside the
# plugin. The plugins.qgis.org security scanner flags installer shell scripts
# (a *.sh that downloads a binary and moves it into a system path is exactly the
# pattern that gets a plugin rejected). Prefer README guidance plus an in-app
# QDesktopServices.openUrl link to the official release page.
# ALLOW_SHELL_SCRIPTS=1
