# flake8 configuration - the AUTHORITATIVE style gate for plugins.qgis.org.
#
# Iterate with ruff (fast, autofixes) but always verify with flake8: ruff does
# not implement the pycodestyle continuation-indent checks (E12x) or W503/W504,
# so a clean ruff run is not proof that flake8 is clean.

[flake8]
max-line-length = 120
extend-ignore =
    E501,
    W503, W504,
    E203,
    E741,
    E125, E126, E127, E128, E131
exclude =
    .git,
    test, tests,
    help,
    i18n,
    __pycache__,
    docs,
    resources.py
